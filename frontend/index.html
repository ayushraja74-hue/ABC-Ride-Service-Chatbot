<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#141517">

    <title>ABC Ride Service Chatbot</title>

    <meta
        name="description"
        content="Get quick answers about ABC Ride Service bookings, rides, policies, and customer support."
    >

    <link rel="stylesheet" href="/static/style.css">
</head>

<body>
    <div class="app-container">

        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar" aria-label="Conversations">

            <div class="sidebar-header">
                <div class="brand">
                    <div class="brand-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M5 16V11l1.6-4.2A2 2 0 0 1 8.5 5.5h7a2 2 0 0 1 1.9 1.3L19 11v5"/>
                            <path d="M3.5 16h17v2.2a.8.8 0 0 1-.8.8H18a.8.8 0 0 1-.8-.8V17.5H6.8v.7a.8.8 0 0 1-.8.8H4.3a.8.8 0 0 1-.8-.8V16z"/>
                            <circle cx="7.8" cy="13.2" r=".6" fill="currentColor"/>
                            <circle cx="16.2" cy="13.2" r=".6" fill="currentColor"/>
                        </svg>
                    </div>
                    <div class="brand-text">
                        <h2>ABC Ride Service</h2>
                        <p>AI Support Assistant</p>
                    </div>
                </div>

                <button type="button" class="icon-button close-sidebar" id="closeSidebar" aria-label="Close sidebar">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
                        <path d="M6 6l12 12M18 6L6 18"/>
                    </svg>
                </button>
            </div>

            <button type="button" class="new-chat-btn" id="newChatBtn">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
                    <path d="M12 5v14M5 12h14"/>
                </svg>
                <span>New Chat</span>
            </button>

            <div class="history-heading" id="historyHeading">Chat History</div>

            <nav class="chat-history" id="chatHistory" aria-labelledby="historyHeading">
                <p class="history-empty">Your chats will appear here.</p>
            </nav>

            <div class="sidebar-footer">
                <div class="footer-mark" aria-hidden="true">A</div>
                <div class="footer-text">
                    <strong>ABC Ride Service</strong>
                    <span>AI Support Assistant</span>
                </div>
            </div>

        </aside>

        <div class="sidebar-backdrop" id="sidebarBackdrop" aria-hidden="true"></div>

        <!-- Main chat section -->
        <main class="main-content">

            <header class="topbar">
                <button type="button" class="icon-button menu-button" id="menuBtn" aria-label="Open sidebar" aria-controls="sidebar">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
                        <path d="M4 7h16M4 12h16M4 17h16"/>
                    </svg>
                </button>

                <div class="topbar-title">
                    <span class="topbar-name">ABC Ride Service</span>
                    <span class="topbar-sub">Your AI Ride Support Assistant</span>
                </div>

                <span class="online-status" id="onlineStatus" data-state="unknown">
                    <span class="status-dot" aria-hidden="true"></span>
                    <span id="statusText">AI Assistant</span>
                </span>
            </header>

            <!-- Conversation -->
            <section class="chat-area" id="chatArea" aria-label="Chat conversation" tabindex="-1">
                <div class="messages" id="messages" aria-live="polite" aria-relevant="additions"></div>
            </section>

            <!-- Message composer -->
            <footer class="composer-area">

                <form class="message-form" id="messageForm" autocomplete="off">

                    <textarea
                        id="messageInput"
                        name="message"
                        placeholder="Ask about rides, bookings, fares, or support..."
                        rows="1"
                        maxlength="10000"
                        aria-label="Your message"
                    ></textarea>

                    <button type="submit" id="sendBtn" class="send-btn" aria-label="Send message" disabled>
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M12 19V5M5 12l7-7 7 7"/>
                        </svg>
                    </button>

                </form>

                <p class="disclaimer">AI responses may occasionally be inaccurate.</p>

            </footer>

        </main>
    </div>

    <script src="/static/script.js"></script>
</body>
</html>
